<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilote</title>
<meta name="description" content="Ton stock, tes envois et ta compta Vinted, dans ta poche.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icones/icone-32.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une app de téléphone, une colonne de 520 px maximum, barre d'onglets fixée en bas, fiches en plein écran. */
:root{
  --bg:#FFFFFF; --surface:#F3F5F4; --surface-2:#E9EDEB; --line:#E2E6E4; --line-2:#D5DAD8;
  --ink:#151918; --ink2:#474F4D; --ink3:#5F6967;
  --accent:#0A7A71; --accent-ink:#075E57; --accent-soft:#E2F1EE; --on-accent:#FFFFFF;
  --warn:#9A3408; --warn-soft:#FFF0E5; --warn-strong:#C2410C; --on-warn:#FFFFFF;
  --good:#13734A; --good-soft:#E4F3EA;
  --bad:#B42318; --bad-soft:#FDECEA;
  --violet:#4A4570; --violet-soft:#ECEAF3;
  --bleu:#34506F; --bleu-soft:#E7EEF6;
  --t1:#F3ECE4; --t1i:#8A6A4C; --t2:#E9ECEB; --t2i:#56615E; --t3:#E7EEF6; --t3i:#4A6380;
  --t4:#EAF1EC; --t4i:#4D6B57; --t5:#F1E9EE; --t5i:#7A5A6C; --t6:#ECEAF3; --t6i:#5E5A7E;
  --voile:rgba(15,19,18,.38);
  --f-titre:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-texte:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1312; --surface:#182120; --surface-2:#202B29; --line:#2A3533; --line-2:#36433F;
  --ink:#EEF3F1; --ink2:#C3CECA; --ink3:#9AA8A3;
  --accent:#5CC8BC; --accent-ink:#86DCD2; --accent-soft:#16312E; --on-accent:#06231F;
  --warn:#FFB38A; --warn-soft:#3A2114; --warn-strong:#F28A52; --on-warn:#1A0B03;
  --good:#6FD49D; --good-soft:#13301F;
  --bad:#FF8A80; --bad-soft:#3A1715;
  --violet:#B9B3E8; --violet-soft:#25233A;
  --bleu:#9DBAD9; --bleu-soft:#1B2733;
  --t1:#2B241D; --t1i:#D8B99A; --t2:#222A28; --t2i:#AEBBB7; --t3:#1D2632; --t3i:#9FBAD8;
  --t4:#1D2A22; --t4i:#9CC6A9; --t5:#2A2027; --t5i:#D3AFC3; --t6:#24223A; --t6i:#B8B3E0;
  --voile:rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#182120; --surface-2:#202B29; --line:#2A3533; --line-2:#36433F;
  --ink:#EEF3F1; --ink2:#C3CECA; --ink3:#9AA8A3;
  --accent:#5CC8BC; --accent-ink:#86DCD2; --accent-soft:#16312E; --on-accent:#06231F;
  --warn:#FFB38A; --warn-soft:#3A2114; --warn-strong:#F28A52; --on-warn:#1A0B03;
  --good:#6FD49D; --good-soft:#13301F;
  --bad:#FF8A80; --bad-soft:#3A1715;
  --violet:#B9B3E8; --violet-soft:#25233A;
  --bleu:#9DBAD9; --bleu-soft:#1B2733;
  --t1:#2B241D; --t1i:#D8B99A; --t2:#222A28; --t2i:#AEBBB7; --t3:#1D2632; --t3i:#9FBAD8;
  --t4:#1D2A22; --t4i:#9CC6A9; --t5:#2A2027; --t5i:#D3AFC3; --t6:#24223A; --t6i:#B8B3E0;
  --voile:rgba(0,0,0,.55); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-texte);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.entete{padding:18px 16px 10px;display:flex;flex-direction:column;gap:12px}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nom-app{font-family:var(--f-titre);font-size:27px;font-weight:700;letter-spacing:-.5px}
.titre{margin:0;font-family:var(--f-titre);font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.15;text-wrap:balance}
.sous{margin:0;font-size:14px;color:var(--ink3)}
.etat-sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink3)}
.etat-sync i{width:7px;height:7px;border-radius:99px;background:var(--ink3);display:block}
.etat-sync.on i{background:var(--good)}
.bouton-rond{width:44px;height:44px;border-radius:99px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.recherche{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;background:var(--surface);border-radius:10px;color:var(--ink3)}
.recherche input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);outline:none;min-height:42px}
.tuiles{padding:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tuile{padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tuile b{font-family:var(--f-titre);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tuile span{font-size:12px;font-weight:500;color:var(--ink3)}
.tuile.chaud{border-color:transparent;background:var(--warn-soft)} .tuile.chaud b,.tuile.chaud span{color:var(--warn)}
.tuile.bon{border-color:transparent;background:var(--good-soft)} .tuile.bon b,.tuile.bon span{color:var(--good)}
.puces{padding:14px 16px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.puces::-webkit-scrollbar{display:none}
.puce{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);font-size:13px;font-weight:500;white-space:nowrap}
.puce[aria-pressed="true"]{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.grille{padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:500px){.grille{grid-template-columns:repeat(3,minmax(0,1fr))}}
.carte-art{display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;padding:0;min-width:0}
.photo{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.photo svg{width:44%;height:auto}
.t1{background:var(--t1);color:var(--t1i)} .t2{background:var(--t2);color:var(--t2i)} .t3{background:var(--t3);color:var(--t3i)}
.t4{background:var(--t4);color:var(--t4i)} .t5{background:var(--t5);color:var(--t5i)} .t6{background:var(--t6);color:var(--t6i)}
.pastille{position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:6px;background:var(--bg);color:var(--ink);font-size:11px;font-weight:700;white-space:nowrap}
.pastille.chaud{background:var(--warn-soft);color:var(--warn)}
.pastille.dort{background:var(--ink);color:var(--bg)}
.pastille.bon{background:var(--good-soft);color:var(--good)}
.pastille.gris{background:var(--surface-2);color:var(--ink2)}
.carte-art .prix{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.carte-art .nom{font-size:13px;font-weight:500;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carte-art .meta{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vide{margin:8px 16px;padding:24px 20px;border-radius:14px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink2)}
.vide b{color:var(--ink);font-size:16px}
.vide p{margin:0;font-size:14px;line-height:1.5;max-width:34ch}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:0;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-plein{background:var(--accent);color:var(--on-accent)}
.btn-noir{background:var(--ink);color:var(--bg)}
.btn-contour{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-leger{background:var(--surface);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-petit{min-height:40px;font-size:14px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:default}
.plein{width:100%}
.section{padding:0 16px;margin-top:22px;display:flex;flex-direction:column;gap:10px}
.section h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.bloc{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.rangee{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.rangee:first-child{border-top:0}
.rangee .fl{flex:1;min-width:0}
.rangee .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.point{width:9px;height:9px;border-radius:99px;flex-shrink:0}
.note{font-size:13px;line-height:1.45;color:var(--ink3);margin:0}
.encart{padding:12px 14px;border-radius:12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink2)}
.encart svg{flex-shrink:0;margin-top:1px}
.encart b{color:var(--ink)}
.encart.chaud{background:var(--warn-soft);color:var(--warn)} .encart.chaud b{color:var(--warn)}
.encart.violet{background:var(--violet-soft);color:var(--violet)} .encart.violet b{color:var(--violet)}
.encart.vert{background:var(--accent-soft);color:var(--accent-ink)} .encart.vert b{color:var(--accent-ink)}
/* barre d'onglets */
.onglets{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);box-sizing:border-box;padding:8px 6px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:20}
.onglet{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;border:0;background:none;color:var(--ink3);font-size:11px;font-weight:600;padding:0}
.onglet[aria-current="page"]{color:var(--accent);font-weight:700}
.onglet .plus{width:40px;height:40px;border-radius:99px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.onglet.central{color:var(--ink);font-weight:700;gap:3px}
.badge{position:absolute;top:0;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:99px;background:var(--warn-strong);color:var(--on-warn);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* fiches plein écran */
.feuille{position:fixed;inset:0;z-index:40;background:var(--voile);display:flex;justify-content:center;align-items:flex-end}
.panneau{width:min(520px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){.panneau{height:94%;border-radius:18px 18px 0 0}}
.panneau-tete{min-height:56px;padding:0 8px;padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);flex-shrink:0}
.panneau-tete .t{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone-btn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:99px;flex-shrink:0}
.panneau-corps{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panneau-pied{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}
.panneau-pied .btn{flex:1}
.agent-tag{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.a-achat{background:var(--bleu-soft);color:var(--bleu)} .a-annonce{background:var(--accent-soft);color:var(--accent-ink)}
.a-vente{background:var(--warn-soft);color:var(--warn)} .a-compta{background:var(--good-soft);color:var(--good)}
.a-relance{background:var(--violet-soft);color:var(--violet)} .a-analyste{background:var(--surface-2);color:var(--ink)}
.choix{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.choix .ic{width:48px;height:48px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.choix .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.choix .tx b{font-size:16px}
.choix .tx span{font-size:13px;line-height:1.35;color:var(--ink3)}
.choix .tx em{font-style:normal;font-size:12px;font-weight:700}
.depot{margin:18px 16px 0;padding:20px 16px;border:1.5px dashed var(--line-2);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.depot b{font-size:15px}
.depot span{font-size:13px;line-height:1.4;color:var(--ink3);max-width:34ch}
.capture{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.capture:first-child{border-top:0}
.capture img{width:44px;height:60px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);flex-shrink:0}
.capture .fl{flex:1;min-width:0;font-size:14px}
.capture .fl small{display:block;color:var(--ink3);font-size:12px}
.roue{width:18px;height:18px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:tourne .8s linear infinite;flex-shrink:0}
@keyframes tourne{to{transform:rotate(360deg)}}
.proposition{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.proposition.fait{opacity:.55}
.prop-tete{padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface)}
.prop-tete .rq{flex-basis:100%;font-size:13px;color:var(--ink2);line-height:1.4}
.prop-corps{padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prop-corps .large{grid-column:1 / -1}
.champ{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink3);min-width:0}
.champ input,.champ select,.champ textarea{min-height:44px;width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font-size:16px;font-weight:500}
.champ.douteux input{border-color:var(--warn-strong);background:var(--warn-soft)}
.champ.douteux{color:var(--warn)}
.prop-pied{padding:0 14px 14px;display:flex;gap:10px}
.prop-pied .btn{flex:1}
.fait-ok{padding:12px 14px;font-size:14px;font-weight:700;color:var(--good);display:flex;gap:8px;align-items:center}
/* fiche article */
.grande-photo{position:relative;height:300px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grande-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.grande-photo svg.silh{width:120px;height:120px}
.grande-photo .retour{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border-radius:99px;border:0;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center}
.grande-photo .pastille{top:auto;bottom:12px;left:12px;font-size:12px;padding:5px 10px}
.argent{margin:0 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.argent div{padding:12px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.argent div:first-child{border-left:0}
.argent span{font-size:12px;color:var(--ink3)}
.argent b{font-size:17px;font-variant-numeric:tabular-nums}
.argent .bon{background:var(--good-soft)} .argent .bon span,.argent .bon b{color:var(--good)}
.argent .mauvais{background:var(--bad-soft)} .argent .mauvais span,.argent .mauvais b{color:var(--bad)}
.parcours{padding:0 16px;display:flex;flex-direction:column}
.etape{display:flex;gap:12px}
.etape .rail{display:flex;flex-direction:column;align-items:center}
.etape .rond{width:22px;height:22px;box-sizing:border-box;border-radius:99px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line-2);background:var(--bg);color:var(--on-accent)}
.etape.fait .rond{background:var(--accent);border-color:var(--accent)}
.etape.ici .rond{border-color:var(--warn-strong)}
.etape .trait{width:2px;flex:1;min-height:18px;background:var(--line-2)}
.etape.fait .trait{background:var(--accent)}
.etape .tx{padding:1px 0 14px;display:flex;flex-direction:column;gap:1px}
.etape .tx b{font-size:14px}
.etape.pas-fait .tx b{color:var(--ink3);font-weight:600}
.etape.ici .tx b{color:var(--warn)}
.etape .tx span{font-size:12px;color:var(--ink3)}
.actions{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.actions .duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.confirm{padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:600}
/* colis */
.colis{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.colis-delai{padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.colis-delai.retard{background:var(--bad-soft);color:var(--bad)}
.colis-delai.calme{background:var(--surface);color:var(--ink2)}
.colis-delai .r{margin-left:auto;font-size:13px}
.colis-art{padding:14px;display:flex;gap:12px;align-items:center}
.vignette{width:60px;height:72px;flex-shrink:0;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vignette img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.vignette svg{width:36px;height:36px}
.coche{min-height:44px;display:flex;align-items:center;gap:12px;font-size:15px;border-top:1px solid var(--line);margin:0 14px}
.coche input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.coche input:checked + span{color:var(--ink3);text-decoration:line-through}
/* compta et analyse */
.bascule{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:3px;border-radius:10px;background:var(--surface);gap:3px}
.bascule button{min-height:38px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.bascule button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav-periode{display:flex;align-items:center;gap:6px}
.nav-periode .lab{flex:1;text-align:center;font-weight:700;font-size:15px}

    else h += '<button class="btn btn-noir plein" data-action="analyser">' + (an ? "Refaire l'analyse" : "Demander conseil") + "</button>";

  /* Lecture des captures : l'app les envoie, ton Mac les lit, tu valides les fiches */
  var CAPTURES = [];
  /* Une capture d'iPhone pèse 2 à 4 Mo : on la ramène à 2000 px en JPEG, le texte reste lisible. */
  function reduireImage(f) {
    return new Promise(function (ok) {
      var img = new Image(), u = URL.createObjectURL(f);
      img.onload = function () {
        var k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        c.toBlob(function (b) { ok(b || f); }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(u); ok(f); };
      img.src = u;
    });
  }
  function lireCaptures(fichiers, indice) {
    var l = Array.from(fichiers || []).filter(function (f) { return /^image\//.test(f.type); }).slice(0, 10);
    if (!l.length) return;
    if (DEMO) { toast("Mode démo : les captures ne partent pas."); return; }
    CAPTURES = l.map(function (f) { return { f: f, url: URL.createObjectURL(f), etat: "attente", msg: "" }; });
    PROPS = [];
    ouvrirFiche(ficheEnvoi);
    var ops = [], i = 0;
    (function suivante() {
      if (i >= CAPTURES.length) {
        if (!ops.length) { rendreSiEnvoi(); return; }
        ops.push({ op: "update", chemin: "synchro/demande", donnees: { demandeLe: new Date().toISOString(), statut: "en_attente" } });
        ecrire(ops).then(rendreSiEnvoi, function () {
          CAPTURES.forEach(function (c) { if (c.etat === "fait") { c.etat = "erreur"; c.msg = "Pas enregistrée, renvoie-la."; } });
          rendreSiEnvoi();
        });
        return;
      }
      var c = CAPTURES[i++]; c.etat = "lecture"; rendreSiEnvoi();
      reduireImage(c.f).then(function (b) {
        return appel("photo", { method: "POST", query: "&dossier=captures", headers: { "content-type": b.type || "image/jpeg" }, body: b });
      }).then(function (j) {
        ops.push({ op: "set", chemin: "captures/" + uid(), donnees: { photo: j.id, indice: indice, statut: "a_lire", envoyeeLe: new Date().toISOString() } });
        c.etat = "fait"; c.msg = "Envoyée à ton Mac";
      }).catch(function (e) {
        c.etat = "erreur"; c.msg = e && e.code === "reseau" ? "Pas de réseau" : (e && e.message) || "Pas envoyée";
      }).then(suivante);
    })();
  }
  function ligneCapture(c) {
    var st = c.etat === "lecture" ? '<span class="roue"></span>' : c.etat === "fait" ? '<span style="color:var(--good)">' + ico("ok", 20, 2.4) + "</span>" : c.etat === "erreur" ? '<span style="color:var(--bad)">' + ico("info", 20) + "</span>" : "";
    var tx = c.etat === "attente" ? "En attente" : c.etat === "lecture" ? "Envoi en cours" : c.msg;
    return '<div class="capture">' + (c.url ? '<img src="' + c.url + '" alt="Capture envoyée">' : '<span class="ic-cap">' + ico("images", 22) + "</span>") +
      '<span class="fl">Capture<small>' + esc(tx) + "</small></span>" + st + "</div>";
  }
  function ficheEnvoi() {
    var enCours = CAPTURES.some(function (c) { return c.etat === "attente" || c.etat === "lecture"; });
    var parties = CAPTURES.filter(function (c) { return c.etat === "fait"; }).length;
    var h = tete(enCours ? "Envoi des captures…" : "Captures envoyées") + '<div class="panneau-corps"><div style="padding:12px 16px">' + CAPTURES.map(ligneCapture).join("") + "</div>";
    if (!enCours && parties) {

    ouvrirFiche(function () {
      function ch(n, lab, v, type, large) {
        return '<label class="champ' + (large ? " large" : "") + '">' + lab + '<input id="f-' + n + '" ' + (type === "date" ? 'type="date"' : type === "prix" ? 'inputmode="decimal"' : 'type="text"') + ' value="' + esc(v == null ? "" : v) + '"></label>';
      }
      var st = [["stock", "Pas encore en ligne"], ["en_ligne", "En ligne"], ["vendu", "Vendu, à envoyer"], ["envoye", "Envoyé"], ["paye", "Payé"], ["retire", "Retiré"]];
      $("#panneau").innerHTML = tete(id ? "Modifier l'article" : "Nouvel article") + '<form class="panneau-corps" id="form-article" data-id="' + esc(a.id) + '">' +
        '<div class="prop-corps" style="padding:16px">' +
        ch("titre", "Titre", a.titre, "t", true) + ch("marque", "Marque", a.marque) + ch("categorie", "Catégorie", a.categorie) + ch("taille", "Taille", a.taille) + ch("etat", "État", a.etat) +
        '<label class="champ large">Où il en est<select id="f-statut">' + st.map(function (s) { return '<option value="' + s[0] + '"' + (a.statut === s[0] ? " selected" : "") + ">" + s[1] + "</option>"; }).join("") + "</select></label>" +
        ch("prix", "Prix demandé, €", a.prix, "prix") + ch("cout", "Coût d'achat, €", a.cout, "prix") +
        ch("dateAchat", "Acheté le", a.dateAchat, "date") + ch("dateEnLigne", "En ligne le", a.dateEnLigne, "date") +
        ch("prixVente", "Vendu, €", a.prixVente, "prix") + ch("dateVente", "Vendu le", a.dateVente, "date") +
        ch("dateLimite", "À envoyer avant le", a.dateLimite, "date") + ch("dateEnvoi", "Envoyé le", a.dateEnvoi, "date") +
        ch("datePaiement", "Payé le", a.datePaiement, "date") + ch("transporteur", "Transporteur", a.transporteur) +
        '</div><p class="note" style="padding:0 16px">Laisse le coût à 0 si l\'article t\'appartenait déjà.</p>' +
        '<div class="panneau-pied" style="border-top:0"><button type="button" class="btn btn-leger" data-action="fermer">Annuler</button><button class="btn btn-plein" type="submit">Enregistrer</button></div></form>';
    }, "form");
  }
  function sauverFormulaire(form) {
    var id = form.getAttribute("data-id");
    var a = Object.assign({}, S.articles.get(id) || { id: id, creeLe: new Date().toISOString(), source: "main" });
    function v(n) { var el = $("#f-" + n); return el ? el.value.trim() : ""; }
    ["titre", "marque", "categorie", "taille", "etat", "transporteur"].forEach(function (k) { a[k] = v(k) || null; });
    ["prix", "cout", "prixVente"].forEach(function (k) { a[k] = num(v(k)); });
    if (a.cout == null) a.cout = 0;
    ["dateAchat", "dateEnLigne", "dateVente", "dateLimite", "dateEnvoi", "datePaiement"].forEach(function (k) { a[k] = valide(v(k)) ? v(k) : null; });
    a.statut = v("statut") || "en_ligne";
    if (!a.titre) { toast("Donne au moins un titre à l'article."); return; }
    if (estVendu(a) && a.prixVente == null) a.prixVente = a.prix;
    if (estVendu(a) && !a.dateVente) a.dateVente = auj();
    if (a.statut === "vendu" && !a.dateLimite) a.dateLimite = plusOuvres(a.dateVente, 5);
    if (a.statut === "en_ligne" && !a.dateEnLigne) a.dateEnLigne = auj();
    enregistrer(a).then(function () { toast("Enregistré"); ficheArticle(a.id); }).catch(function () {});
  }

  /* Agent Analyste : les chiffres partent avec la demande, le Mac répond */
  function analyser() {
    if (S.demandeAnalyse && S.demandeAnalyse.statut === "en_attente") return;
    var t = new Date().toISOString();
    S.demandeAnalyse = { statut: "en_attente", demandeLe: t }; rendre();
    ecrire([{ op: "set", chemin: "analyses/demande", donnees: { statut: "en_attente", demandeLe: t, chiffres: stats() } },
            { op: "update", chemin: "synchro/demande", donnees: { demandeLe: t, statut: "en_attente" } }])
      .then(function () { toast("Demande envoyée à ton Mac"); }).catch(function () {});
  }

  /* ───────── petites actions ───────── */
  function maj(id, champs) {
    var a = S.articles.get(id); if (!a) return Promise.resolve();
    return enregistrer(Object.assign({}, a, champs));
  }
  var tt = null;
  function toast(m) { var t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3200); }
  var indiceEnCours = "auto";

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-action]"); if (!b || b.disabled) return;
    var act = b.getAttribute("data-action"), id = b.getAttribute("data-id");
    switch (act) {
      case "onglet":
        F.onglet = b.getAttribute("data-onglet"); try { localStorage.setItem("pilote.onglet", F.onglet); } catch (x) {}
        try { history.replaceState(null, "", "#" + F.onglet); } catch (x) {}
        if (!$("#feuille").hidden) fermerFiche();
        rendre(); window.scrollTo(0, 0); break;
      case "filtre": F.filtre = b.getAttribute("data-filtre"); rendre(); break;
      case "filtre-endormis": F.onglet = "stock"; F.filtre = "endormis"; rendre(); window.scrollTo(0, 0); break;
      case "filtre-stock": F.onglet = "stock"; F.filtre = "stock"; rendre(); window.scrollTo(0, 0); break;
      case "ajouter": ficheAjouter(); break;
      case "fermer": fermerFiche(); rendre(); break;
      case "capture": indiceEnCours = b.getAttribute("data-indice"); var inp = $("#fichiers"); inp.value = ""; inp.click(); break;
      case "nouveau-manuel": ficheFormulaire(null); break;
      case "ouvrir": ficheArticle(id); break;
      case "modifier": ficheFormulaire(FICHE.id); break;
      case "vendre": FICHE.vendre = true; FICHE.rendre(); break;
      case "annuler-vente": FICHE.vendre = false; FICHE.rendre(); break;
      case "mettre-en-ligne": maj(FICHE.id, { statut: "en_ligne", dateEnLigne: auj() }).then(function () { toast("En ligne"); }); break;
      case "baisser": maj(FICHE.id, { prix: num(b.getAttribute("data-prix")), dateRelance: auj() }).then(function () { toast("Prix baissé. Pense à le changer aussi dans Vinted."); }); break;
      case "remonter": maj(FICHE.id, { dateEnLigne: auj(), dateRelance: auj() }).then(function () { toast("Compteur remis à zéro"); }); break;
      case "retirer": maj(FICHE.id, { statut: "retire" }).then(function () { toast("Retiré de la vente"); fermerFiche(); rendre(); }); break;
      case "deposer": maj(id, { statut: "envoye", dateEnvoi: auj() }).then(function () { toast("Colis déposé. L'argent tombera à la réception."); }); break;
      case "recu": maj(id, { statut: "paye", datePaiement: auj() }).then(function () { toast("Argent reçu, compté dans ta compta"); }); break;
      case "demander-suppr": FICHE.confirmer = true; FICHE.rendre(); break;
      case "annuler-suppr": FICHE.confirmer = false; FICHE.rendre(); break;
      case "supprimer": var sid = FICHE.id; fermerFiche(); effacer(sid).then(function () { toast("Article supprimé"); rendre(); }); break;
      case "periode": F.periode = b.getAttribute("data-p"); F.decalage = 0; rendre(); break;
      case "decaler": F.decalage = Math.min(0, F.decalage + Number(b.getAttribute("data-d"))); rendre(); break;
      case "modifier-objectif": FICHE.editObjectif = true; rendre(); break;
      case "annuler-objectif": FICHE.editObjectif = false; rendre(); break;
      case "analyser": analyser(); break;
      case "section": F.section = b.getAttribute("data-s"); rendre(); window.scrollTo(0, 0); break;
      case "synchro": demanderSynchro(); break;
      case "revue": demanderRevue(FICHE.id); break;
      case "ouvrir-vente": ficheArticle(id); FICHE.vendre = true; FICHE.rendre(); break;
      case "copier":
        var ar = S.articles.get(FICHE.id), txt = ar && ar.revue ? ar.revue[b.getAttribute("data-quoi")] : "";
        if (!txt) break;
        try {
          navigator.clipboard.writeText(txt).then(function () { toast("Copié. Colle-le dans ton annonce Vinted."); }, function () { toast("Copie impossible ici : appuie longuement sur le texte pour le copier."); });
        } catch (x) { toast("Copie impossible ici : appuie longuement sur le texte pour le copier."); }
        break;
      case "valider-captures": ouvrirValidation(); break;
      case "reessayer": verifierEtat(); break;
      case "fait":
        var q = b.getAttribute("data-quoi"), aa = S.articles.get(id);
        if (!aa) break;
        b.disabled = true;
        if (q === "taille") maj(id, { tailleCorrigee: auj() }).then(function () { toast("Noté. Vérifie que la description dit la même taille."); });
        else if (q === "reposter") maj(id, { dateEnLigne: auj(), dateEnLigneApprox: false, dateRepost: auj(), reposts: (num(aa.reposts) || 0) + 1, favoris: 0, repostEnAttente: true, absentVinted: false }).then(function () { toast("Reposté : le compteur repart de zéro"); });
        else if (q === "baisser") maj(id, { prix: num(b.getAttribute("data-prix")), dateBaisse: auj() }).then(function () { toast("Prix baissé dans Pilote. Change-le aussi sur Vinted."); });
        else if (q === "retirer") maj(id, { statut: "retire", absentVinted: false }).then(function () { toast("Retiré de la vente"); });
        else if (q === "hashtags") maj(id, { hashtagsNettoyes: auj() }).then(function () { toast("Noté"); });
        break;
      case "valider-prop": case "ignorer-prop":
        var p = PROPS.find(function (x) { return x.cle === b.getAttribute("data-cle"); });
        if (!p) break;
        if (act === "ignorer-prop") { p.etat = "ignore"; ficheLecture(); rangerCaptures(); break; }
        b.disabled = true;
        appliquer(p).then(function () { ficheLecture(); rangerCaptures(); }).catch(function () { b.disabled = false; });
        break;
      case "tout-valider":
        b.disabled = true;
        var file = PROPS.filter(function (x) { return x.etat === "attente"; });
        file.forEach(function (x) { lireChamps(x); });
        (function suite(k) { if (k >= file.length) { ficheLecture(); rangerCaptures(); toast("Tout est rangé"); return; } appliquer(file[k]).catch(function () {}).then(function () { suite(k + 1); }); })(0);
        break;
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "fichiers") { lireCaptures(t.files, indiceEnCours); return; }
    if (t.getAttribute && t.getAttribute("data-action") === "coche") {
      var a = S.articles.get(t.getAttribute("data-id")); if (!a) return;
      var c = (a.coches || [false, false, false]).slice(); c[Number(t.getAttribute("data-i"))] = t.checked;
      enregistrer(Object.assign({}, a, { coches: c }));
    }
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.id === "recherche") { F.recherche = ev.target.value; var z = $("#zone-grille"); if (z) z.innerHTML = grilleHtml(); }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target; ev.preventDefault();
    if (f.id === "form-code") envoyerCode();
    else if (f.id === "form-article") sauverFormulaire(f);
    else if (f.id === "form-vente") {
      var prix = num($("#v-prix").value), d = $("#v-date").value, l = $("#v-limite").value;
      if (prix == null) { toast("Indique le prix de vente."); return; }
      maj(FICHE.id, { statut: "vendu", prixVente: prix, dateVente: valide(d) ? d : auj(), dateLimite: valide(l) ? l : plusOuvres(auj(), 5), coches: [false, false, false] })
        .then(function () { FICHE.vendre = false; toast("Vendu ! Le colis attend dans Envois."); });
    } else if (f.id === "form-objectif") {
      var m = num($("#obj-montant").value), dt = $("#obj-date").value;
      if (m == null || m <= 0) { toast("Indique un montant en euros."); return; }
      S.reglages = Object.assign({}, S.reglages, { objectif: { montant: m, date: valide(dt) ? dt : null, depart: num($("#obj-depart").value) || 0 } });
      FICHE.editObjectif = false; enregistrerReglages(); rendre(); toast("Objectif enregistré");
    }
  });
  document.addEventListener("paste", function (ev) {
    if (FICHE.mode === "ajouter" && !$("#feuille").hidden) {
      var fs = Array.from((ev.clipboardData && ev.clipboardData.files) || []).filter(function (f) { return /^image\//.test(f.type); });
      if (fs.length) { ev.preventDefault(); lireCaptures(fs, "auto"); }
    }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("#feuille").hidden) { fermerFiche(); rendre(); } });
  document.addEventListener("error", function (ev) { var t = ev.target; if (t && t.tagName === "IMG" && t.src.indexOf(PHOTOS) === 0) t.remove(); }, true);
  $("#feuille").addEventListener("click", function (ev) { if (ev.target.id === "feuille") { fermerFiche(); rendre(); } });

  rendre();
  demarrer();
})();
</script>
</body>
</html>
